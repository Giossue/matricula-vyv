<div class="field {% if campo.errors %}has-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="muted" aria-hidden="true">*</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<span class="help">{{ campo.help_text }}</span>{% endif %}
  {{ campo.errors }}
</div>
